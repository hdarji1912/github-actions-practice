
name: Smart Pipeline

on:
  push:

env:
  ENVIRONMENT: staging

jobs:

  # Job 1 - Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Application
        run: echo "Building the application..."

  # Job 2 - Lint (Intentional Failure)
  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Lint Check
        run: |
          echo "Running lint checks..."
          echo "Lint failed!"
          exit 1

  # Job 3 - Test
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run Tests
        run: echo "Testing the application..."

  # Job 4 - Generate Version
  generate-version:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Version
        run: echo "app_version=v1.0.0" >> $GITHUB_OUTPUT

  # Job 5 - Deploy
  deploy:
    needs: generate-version
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        run: echo "Deploying application..."

  # Job 6 - Summary
  summary:
    needs: [generate-version, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Summary
        run: echo "Pipeline completed."
